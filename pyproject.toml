[project]
name = "scriber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aufa Nabil", email = "aufa.nabil.amiri@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pymupdf ==1.28.2",
    "surya-ocr ==0.22.1",
    "pillow >=10.4",
]

[project.scripts]
scriber = "scriber:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pytest>=8",
]
